image: mcr.microsoft.com/dotnet/sdk:8.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - when: never

stages:
  - test-image
  - test
  - build
  - publish

variables:
  GIT_DEPTH: "0"

test-image:
  stage: test-image
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - |
      AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > ~/.docker/config.json
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=ci
      --local dockerfile=ci
      --opt filename=Dockerfile.tests
      --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/tests:buildcache
      --export-cache type=registry,ref=$CI_REGISTRY_IMAGE/tests:buildcache,mode=max
      --output type=image,name=$CI_REGISTRY_IMAGE/tests:$CI_COMMIT_SHA,push=true

test:
  stage: test
  image: $CI_REGISTRY_IMAGE/tests:$CI_COMMIT_SHA
  script:
    - >
      dotnet test OpenVideoFramework.sln --configuration Release
      --logger trx --results-directory TestResults
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - TestResults/*.trx

build:
  stage: build
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      RELEASE_BRANCH="release/${VERSION%.*}"
      git fetch --no-tags origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/${RELEASE_BRANCH}"; then
        echo "Tag ${CI_COMMIT_TAG} must point to a commit in ${RELEASE_BRANCH}."
        exit 1
      fi
    - dotnet restore OpenVideoFramework.sln
    - >
      dotnet build OpenVideoFramework.sln --configuration Release --no-restore
      -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:DebugType=portable
    - >
      dotnet pack OpenVideoFramework/OpenVideoFramework.csproj --configuration Release --no-build --no-restore
      -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:DebugType=portable
      -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output artifacts
  artifacts:
    paths:
      - artifacts/*.nupkg
      - artifacts/*.snupkg

publish:
  stage: publish
  needs: [build]
  script:
    - ': "${NUGET_API_KEY:?Set NUGET_API_KEY in GitLab CI/CD variables}"'
    - >
      dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json
      --api-key "$NUGET_API_KEY"

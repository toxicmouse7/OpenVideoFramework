image: mcr.microsoft.com/dotnet/sdk:8.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - when: never

stages:
  - build
  - publish

variables:
  GIT_DEPTH: "0"

build:
  stage: build
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      RELEASE_BRANCH="release/${VERSION%.*}"
      git fetch --no-tags origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/${RELEASE_BRANCH}"; then
        echo "Tag ${CI_COMMIT_TAG} must point to a commit in ${RELEASE_BRANCH}."
        exit 1
      fi
    - dotnet restore OpenVideoFramework.sln
    - >
      dotnet build OpenVideoFramework.sln --configuration Release --no-restore
      -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:DebugType=portable
    - >
      dotnet pack OpenVideoFramework/OpenVideoFramework.csproj --configuration Release --no-build --no-restore
      -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:DebugType=portable
      -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output artifacts
  artifacts:
    paths:
      - artifacts/*.nupkg
      - artifacts/*.snupkg

publish:
  stage: publish
  needs: [build]
  script:
    - ': "${NUGET_API_KEY:?Set NUGET_API_KEY in GitLab CI/CD variables}"'
    - >
      dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json
      --api-key "$NUGET_API_KEY"
